services:
  spring-ive:
    image: dazzlepf/spring-ive:latest
    ports:
      - "443:443"
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
      - ./claude-config:/home/ive/.claude
      - ./ssl:/app/ssl:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ENCRYPTION_KEY=spring-ive-dev-encryption-key-change-in-prod
      - JWT_SECRET=spring-ive-dev-secret-change-in-production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
