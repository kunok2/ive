services:
  springware-ive:
    image: springware-ive:latest
    env_file:
      - .env
    container_name: springware-ive
    restart: unless-stopped
    # PID 1 이 npm start 면 에이전트 빌드가 남긴 고아(esbuild·headless_shell)를 회수하지 못해
    # 좀비가 쌓인다(2026-10-04 301개). tini 를 PID 1 로 둔다.
    init: true
    # 같은 장비에 운영 앱(product-factory-*)이 함께 돈다. 에이전트 여럿이 동시에 vite build·vue-tsc 를
    # 돌리면 코어 4개를 다 먹어 운영이 밀린다(2026-10-04 load 9.5). 코어 2개로 묶는다.
    cpus: "2"
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-springware-ive-secret-change-me}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-springware-ive-encryption-key-change-me}
      - SHELL=/bin/bash
      # claude-config를 다른 컨테이너(product-factory-ai)와 공유하면 그쪽 settings.json의
      # "model": "sonnet" 을 물려받아 조용히 Opus->Sonnet 으로 바뀐다.
      # IVE는 --model 을 넘기지 않으므로(cli.claude.model 미설정) 여기서 못박아 격리한다.
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-opus}
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
      # OAuth 자격증명 저장소. 같은 계정을 쓰는 다른 컨테이너와 사본을 각자 들고 있으면
      # 토큰 갱신 시 refresh token 이 로테이션되어 늦게 갱신한 쪽이 revoke 된다(2026-08 장애).
      # 사본이 아니라 같은 디렉터리를 보도록 CLAUDE_CONFIG_HOST_DIR 로 공유 경로를 주입한다.
      - ${CLAUDE_CONFIG_HOST_DIR:-./claude-config}:/home/ive/.claude
      - ./codex-config:/home/ive/.codex
      # agy(Antigravity CLI) 설정·자격증명. agy 는 ~/.gemini 아래를 쓴다(Gemini CLI 경로 승계).
      - ${AGY_CONFIG_HOST_DIR:-./agy-config}:/home/ive/.gemini
      - ./agy-state:/home/ive/.antigravity
      - ./opencode-config:/home/ive/.local/share/opencode
    # 앱 로거가 죽거나 우회되더라도 컨테이너 stdout이 무한정 커지지 않도록
    # 도커 레벨에서 로테이션 한도를 둔다 (앱 파일 로거와 별도 안전망).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
