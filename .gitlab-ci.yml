stages:
  - build
  - publish

variables:
  IMAGE_NAME: dazzlepf/spring-ive

# 이미지 빌드 → Watchtower가 30초 내 자동 배포
build-image:
  stage: build
  tags:
    - deploy
  script:
    - DOCKER_BUILDKIT=1 docker build --no-cache --provenance=false -t $IMAGE_NAME:build .
    - docker tag $IMAGE_NAME:build $IMAGE_NAME:latest
    - docker tag $IMAGE_NAME:build $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker rmi $IMAGE_NAME:build
    - docker image prune -f
    - docker builder prune -a -f --filter 'until=24h'
  only:
    - main

# Docker Hub 배포 (수동 실행)
publish-dockerhub:
  stage: publish
  tags:
    - deploy
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
  script:
    - docker tag $IMAGE_NAME:latest $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  only:
    - main
  when: manual
