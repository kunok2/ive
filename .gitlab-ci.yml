stages:
  - test
  - deploy
  - publish

variables:
  IMAGE_NAME: springware-ive
  HUB_IMAGE: dazzlepf/springware-ive
  IVE_DIR: /home/ubuntu/ive

# 테스트 (main push 시 배포 전 자동 실행)
test:
  stage: test
  tags:
    - deploy
  script:
    - cd $IVE_DIR/repo || cd $CI_PROJECT_DIR
    - npm ci --ignore-scripts
    - cd node_modules/better-sqlite3 && npx --yes prebuild-install || npx --yes node-gyp rebuild
    - cd $CI_PROJECT_DIR
    - npm test
  only:
    - main

# 로컬 빌드 + 컨테이너 재시작 (main push 시 자동)
deploy:
  stage: deploy
  tags:
    - deploy
  script:
    - echo "=== 1. Docker 이미지 빌드 ==="
    - DOCKER_BUILDKIT=1 docker build --provenance=false -t $IMAGE_NAME:latest .
    - echo "=== 2. 배포 디렉토리에 docker-compose.yml 동기화 ==="
    - cp docker-compose.yml $IVE_DIR/docker-compose.yml
    - cd $IVE_DIR
    - echo "=== 3. 기존 컨테이너 중지 및 제거 ==="
    - docker compose down --remove-orphans
    - echo "=== 4. 새 컨테이너 강제 재생성 ==="
    - docker compose up --force-recreate -d
    - echo "=== 5. 배포 상태 확인 ==="
    - sleep 5
    - docker compose ps
    - docker compose logs --tail=20
    - echo "=== 6. 미사용 이미지 정리 ==="
    - docker image prune -f
    - docker builder prune -a -f --filter 'until=24h'
    - echo "=== 배포 완료 ==="
  only:
    - main

# Docker Hub에 이미지 게시 (수동 실행)
publish-to-hub:
  stage: publish
  tags:
    - deploy
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
  script:
    - docker tag $IMAGE_NAME:latest $HUB_IMAGE:latest
    - docker tag $IMAGE_NAME:latest $HUB_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $HUB_IMAGE:latest
    - docker push $HUB_IMAGE:$CI_COMMIT_SHORT_SHA
  when: manual
  only:
    - main
