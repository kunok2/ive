stages:
  - build
  - deploy
  - publish

variables:
  IMAGE_NAME: dazzlepf/spring-ive
  DEPLOY_COMPOSE_FILE: /ive-deploy/docker-compose.yml
  DEPLOY_PROJECT_DIR: /home/ubuntu/ive

# 이미지 빌드
build:
  stage: build
  tags:
    - deploy
  script:
    - DOCKER_BUILDKIT=1 docker build --no-cache -t $IMAGE_NAME:latest -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
  only:
    - main

# 컨테이너 재생성 (새 이미지로 자동 교체)
deploy:
  stage: deploy
  tags:
    - deploy
  script:
    - docker compose -f $DEPLOY_COMPOSE_FILE --project-directory $DEPLOY_PROJECT_DIR up -d --force-recreate ive
  only:
    - main

# Docker Hub 배포 (수동 실행)
publish:
  stage: publish
  tags:
    - deploy
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
  script:
    - docker push $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  only:
    - main
  when: manual
