stages:
  - build
  - publish

variables:
  IMAGE_NAME: dazzlepf/spring-ive

# 로컬 이미지 빌드 (Watchtower가 이미지 변경 감지 → 컨테이너 자동 재시작)
build:
  stage: build
  tags:
    - deploy
  script:
    - DOCKER_BUILDKIT=1 docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
  only:
    - main

# Docker Hub 배포 (수동 실행)
publish:
  stage: publish
  tags:
    - deploy
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
  script:
    - docker push $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  only:
    - main
  when: manual
