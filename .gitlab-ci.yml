stages:
  - build
  - deploy

variables:
  IMAGE_NAME: dazzlepf/spring-ive

build:
  stage: build
  tags:
    - deploy
  script:
    - docker build -t spring-ive:latest .
    - docker compose up -d --force-recreate spring-ive
  only:
    - main

deploy:
  stage: deploy
  tags:
    - deploy
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
  script:
    - docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  only:
    - main
  when: manual
