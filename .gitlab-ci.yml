stages:
  - deploy

variables:
  DOCKER_BUILDKIT: "1"
  IMAGE_NAME: dazzlepf/spring-ive

deploy:
  stage: deploy
  tags:
    - deploy
  image: docker:latest
  before_script:
    - apk add --no-cache nodejs npm make python3 g++
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
  script:
    - npm ci
    - npm run deploy
  only:
    - main
